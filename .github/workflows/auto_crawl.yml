name: Auto Crawl Score on Schedule

on:
  schedule:
    # 17:00 UTC = 00:00 đêm giờ Việt Nam
    - cron: '0 17 * * *'
    # 00:05 UTC = 07:05 sáng giờ Việt Nam (Lúc Firestore chính thức reset quota!)
    - cron: '5 0 * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công bất kỳ lúc nào

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chạy tool tự động lấy điểm
        run: |
          python auto_crawl.py GiuaHKI_2026_2027

      - name: Upload file Excel kết quả lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bang_diem_tu_dong_LQD
          path: Bang_diem_tu_dong.xlsx
          if-no-files-found: ignore

      - name: Commit file Excel lên GitHub repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Bang_diem_tu_dong.xlsx || true
          git commit -m "chore: auto update Bang_diem_tu_dong.xlsx [skip ci]" || echo "No changes"
          git push origin main || echo "Push failed"
